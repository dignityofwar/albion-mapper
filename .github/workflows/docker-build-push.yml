name: Build & Publish

# Reusable: called with push=false from pull requests (validation only), and with
# push=true from the deployment pipelines — main publishes the production channel,
# the testing branch publishes the testing one.
on:
  workflow_call:
    inputs:
      push:
        description: 'Push the built image to Docker Hub'
        type: boolean
        required: false
        default: false
      channel:
        description: 'Which channel to publish: production or testing'
        type: string
        required: false
        default: production

jobs:
  # Both names are driven off `push` so a run says what it actually did. A
  # validation build that announces itself as "Build & push" reads as though it
  # published an image, which is exactly the confusion this avoids.
  build:
    name: ${{ inputs.push && 'Build & push server image' || 'Build server image' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Skipped on pull requests: forks have no secrets, and a validation build
      # never talks to the registry.
      - name: Login to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # buildx builds and pushes in a single invocation — layers stream straight
      # to the registry. Splitting it into a build step and a `docker push` step
      # would mean loading the image into the local daemon first, which is slower
      # and buys nothing, so the split is in the naming rather than the mechanism.
      - name: ${{ inputs.push && 'Build and push' || 'Build' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: provisioning/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push }}
          # Two tags per build: the moving one the server's compose file pulls,
          # and a SHA-pinned one so a bad deploy can be rolled back to an exact
          # commit. The channels are namespaced so a testing build can never be
          # mistaken for something production ever ran.
          tags: |
            maelstromeous/albionroads:${{ inputs.channel == 'testing' && 'testing-latest' || 'latest' }}
            maelstromeous/albionroads:${{ inputs.channel == 'testing' && format('testing-{0}', github.sha) || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
